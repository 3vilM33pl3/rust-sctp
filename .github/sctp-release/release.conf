# Settings for the automated SCTP release pipeline (sctp-release.yml).
# Sourced by the scripts in this directory.

# Upstream Rust repository and the branch Rust development happens on.
UPSTREAM_URL=https://github.com/rust-lang/rust
UPSTREAM_DEV_BRANCH=main

# Branch in this fork that carries the SCTP series on top of upstream
# development. New release lines (a Rust minor version that has no SCTP
# release branch yet) are ported from here. Update it whenever the SCTP
# series moves to a newer upstream base.
SCTP_DEV_BRANCH=sctp-1.100

# Oldest Rust minor version to release (1.MIN_MINOR.x). Only the newest
# patch release of each minor version from this one onwards is considered.
MIN_MINOR=100

# Release branches are "${RELEASE_BRANCH_PREFIX}1.N"; release tags are
# "${TAG_PREFIX}1.N.M-sctp.K".
RELEASE_BRANCH_PREFIX=release/sctp-
TAG_PREFIX=rust-

# Label on the issue opened when a release cannot be cut. While an open issue
# with this label names a version, the daily run skips that version; close
# the issue to retry.
BLOCKED_LABEL=sctp-release-blocked
