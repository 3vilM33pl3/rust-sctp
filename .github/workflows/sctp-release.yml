name: SCTP release

# Cuts a Rust+SCTP toolchain release for every new upstream Rust release.
# See .github/sctp-release/README.md.

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream tag to release, e.g. 1.100.0 (empty: every new release)'
        required: false
        default: ''
      from_dev:
        description: 'Re-port from the SCTP development branch instead of the release branch'
        type: boolean
        default: false
      dry_run:
        description: 'Build and test only; do not push, tag or publish'
        type: boolean
        default: false
      macos_only:
        description: 'Only build macOS for an existing release, e.g. rust-1.100.0-sctp.1'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: sctp-release
  cancel-in-progress: false

jobs:
  detect:
    if: ${{ !inputs.macos_only }}
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: .github/sctp-release/detect.sh | tee -a "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.versions != '[]'
    runs-on: [self-hosted, linux, sctp]
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ${{ fromJSON(needs.detect.outputs.versions) }}
    env:
      UPSTREAM_TAG: ${{ matrix.version }}
      GH_TOKEN: ${{ github.token }}
      # port.sh adds an "upstream" remote; without this gh would pick it.
      GH_REPO: ${{ github.repository }}
      FROM_DEV: ${{ inputs.from_dev || 'false' }}
    steps:
      - name: Check out the release tooling
        uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: .github/sctp-release

      # SCTP_RELEASE_TOKEN must be able to push workflow files: rebased
      # release branches carry .github/workflows changes, which the default
      # GITHUB_TOKEN is not allowed to push.
      - name: Check out the fork
        uses: actions/checkout@v4
        with:
          path: src
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # Keep build/ (LLVM, stage0 downloads) between runs; it is ignored by git.
          clean: false
          token: ${{ secrets.SCTP_RELEASE_TOKEN || github.token }}

      - name: Prepare
        run: |
          SCTP_RELEASE_OUT="$RUNNER_TEMP/sctp-release"
          echo "SCTP_RELEASE_OUT=$SCTP_RELEASE_OUT" >>"$GITHUB_ENV"
          rm -rf "$SCTP_RELEASE_OUT"; mkdir -p "$SCTP_RELEASE_OUT"
          cd src
          git rebase --abort 2>/dev/null || true
          git reset -q --hard
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Port SCTP onto ${{ matrix.version }}
        id: port
        working-directory: src
        run: ../tools/.github/sctp-release/port.sh "$UPSTREAM_TAG"

      - name: Choose release tag
        id: tag
        working-directory: src
        run: |
          . ../tools/.github/sctp-release/lib.sh
          echo "name=$(next_release_tag "$UPSTREAM_TAG")" | tee -a "$GITHUB_OUTPUT"

      - name: Build and test ${{ steps.tag.outputs.name }}
        id: build
        working-directory: src
        run: ../tools/.github/sctp-release/build.sh "${{ steps.tag.outputs.name }}"

      - name: Publish ${{ steps.tag.outputs.name }}
        if: ${{ !inputs.dry_run }}
        working-directory: src
        run: ../tools/.github/sctp-release/publish.sh "${{ steps.tag.outputs.name }}"

      - name: Report failure
        if: failure() && !inputs.dry_run
        working-directory: src
        run: |
          stage=publish
          [[ "${{ steps.port.outcome }}" == failure ]] && stage=port
          [[ "${{ steps.build.outcome }}" == failure ]] && stage='build and test'
          ../tools/.github/sctp-release/report-failure.sh "$UPSTREAM_TAG" "$stage"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sctp-release-logs-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/sctp-release/*.log
            ${{ runner.temp }}/sctp-release/*.txt
          if-no-files-found: ignore

  # Native build for Apple Silicon on the owner's Mac, added to the release
  # the Linux job published. The job waits in the queue until that Mac is
  # online (GitHub drops it after 24 hours).
  macos:
    needs: [detect, release]
    if: ${{ always() && (inputs.macos_only || (needs.release.result == 'success' && !inputs.dry_run)) }}
    runs-on: [self-hosted, macOS, ARM64, sctp-mac]
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ${{ fromJSON(inputs.macos_only && format('["{0}"]', inputs.macos_only) || needs.detect.outputs.versions) }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the release tooling
        uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: .github/sctp-release

      - name: Find the release
        id: tag
        working-directory: tools
        run: |
          . .github/sctp-release/lib.sh
          v='${{ matrix.version }}'
          if [[ "$v" == "$TAG_PREFIX"* ]]; then tag="$v"; else tag=$(latest_release_tag "$v"); fi
          gh release view "$tag" --json tagName >/dev/null
          up=${tag#"$TAG_PREFIX"}; up=${up%-sctp.*}
          echo "name=$tag" | tee -a "$GITHUB_OUTPUT"
          echo "upstream=$up" | tee -a "$GITHUB_OUTPUT"

      - name: Check out ${{ steps.tag.outputs.name }}
        uses: actions/checkout@v4
        with:
          path: src
          ref: refs/tags/${{ steps.tag.outputs.name }}
          fetch-depth: 0
          # Keep build/ (LLVM, stage0 downloads) between runs; it is ignored by git.
          clean: false

      - name: Prepare
        run: |
          SCTP_RELEASE_OUT="$RUNNER_TEMP/sctp-release"
          echo "SCTP_RELEASE_OUT=$SCTP_RELEASE_OUT" >>"$GITHUB_ENV"
          rm -rf "$SCTP_RELEASE_OUT"; mkdir -p "$SCTP_RELEASE_OUT"
          echo "UPSTREAM_TAG=${{ steps.tag.outputs.upstream }}" >"$SCTP_RELEASE_OUT/state.env"
          git -C src reset -q --hard

      - name: Build and test ${{ steps.tag.outputs.name }} for macOS
        working-directory: src
        run: ../tools/.github/sctp-release/build.sh "${{ steps.tag.outputs.name }}"

      - name: Attach to ${{ steps.tag.outputs.name }}
        if: ${{ !inputs.dry_run }}
        working-directory: src
        run: ../tools/.github/sctp-release/attach.sh "${{ steps.tag.outputs.name }}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sctp-release-macos-logs-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/sctp-release/*.log
            ${{ runner.temp }}/sctp-release/*.txt
          if-no-files-found: ignore
